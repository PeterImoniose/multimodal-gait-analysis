[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgait"
version = "0.1.0"
description = "Multimodal gait analysis (EEG, EMG, IMU, force plates): data audit, gait biomechanics, wearable validation and subject-wise machine learning"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
